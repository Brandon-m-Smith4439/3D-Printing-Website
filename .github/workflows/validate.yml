          BACKUP_VERIFY_STATUS=$(curl -sS -b /tmp/v088-after-disable.cookies -o /tmp/v088-backup-verify.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data "$(node -e 'process.stdout.write(JSON.stringify({name:process.argv[1]}))' "$BACKUP_NAME")"             http://127.0.0.1:3000/api/owner/backups/verify)
          test "$BACKUP_VERIFY_STATUS" = "200" || { echo "Backup verification endpoint failed"; cat /tmp/v088-backup-verify.json; exit 1; }

name: Validate Website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start production app
        env:
          NEXT_PUBLIC_SITE_URL: https://meshharbor3d.com
          DATABASE_PATH: /tmp/meshharbor-v086.sqlite
          PRIVATE_STORAGE_DIR: /tmp/meshharbor-private
          CUSTOMER_SESSION_SECRET: ci-customer-session-secret-12345678901234567890
          OWNER_SESSION_SECRET: ci-owner-session-secret-12345678901234567890123
          OWNER_PASSWORD: ci-owner-password-12345
        run: |
          npm start > /tmp/meshharbor-server.log 2>&1 &
          echo $! > /tmp/meshharbor-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/meshharbor-server.log
          exit 1
      - name: Verify proxied origin validation
        run: |
          REG_CODE=$(curl -sS -o /tmp/register.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https" -H "Content-Type: application/json"             --data '{"displayName":"","email":"bad","password":"short"}'             http://127.0.0.1:3000/api/account/register)
          test "$REG_CODE" = "400" || { cat /tmp/register.json; exit 1; }

          EVIL_CODE=$(curl -sS -o /tmp/evil.json -w "%{http_code}"             -H "Origin: https://example.invalid" -H "Content-Type: application/json"             --data '{"displayName":"","email":"bad","password":"short"}'             http://127.0.0.1:3000/api/account/register)
          test "$EVIL_CODE" = "403" || { cat /tmp/evil.json; exit 1; }

          UPLOAD_CODE=$(curl -sS -o /tmp/upload.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https" -F "note=test"             http://127.0.0.1:3000/api/custom-request/upload)
          test "$UPLOAD_CODE" = "400" || { cat /tmp/upload.json; exit 1; }

          OWNER_CODE=$(curl -sS -o /tmp/owner-login.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data '{"password":"definitely-not-the-owner-password"}'             http://127.0.0.1:3000/api/owner/login)
          test "$OWNER_CODE" = "401" || { cat /tmp/owner-login.json; exit 1; }
          grep -q "Incorrect password" /tmp/owner-login.json
      - name: Verify 3MF reaches malware scanning
        run: |
          mkdir -p /tmp/three-mf/3D
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>' > /tmp/three-mf/'[Content_Types].xml'
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><resources/><build/></model>' > /tmp/three-mf/3D/3dmodel.model
          (cd /tmp/three-mf && zip -qr /tmp/meshharbor-test.3mf .)
          CODE=$(curl -sS -o /tmp/3mf.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https" -F "file=@/tmp/meshharbor-test.3mf;type=model/3mf"             http://127.0.0.1:3000/api/custom-request/upload)
          test "$CODE" = "503" || { cat /tmp/3mf.json; exit 1; }
          grep -q "File scanning is temporarily unavailable" /tmp/3mf.json
      - name: Verify final-balance invoice workflow
        run: |
          rm -f /tmp/meshharbor-v086-invoice.sqlite*
          node <<'NODE'
          const { DatabaseSync } = require("node:sqlite");
          const db = new DatabaseSync("/tmp/meshharbor-v086-invoice.sqlite");
          db.exec(`
            CREATE TABLE IF NOT EXISTS app_records (
              collection TEXT NOT NULL,
              id TEXT NOT NULL,
              json TEXT NOT NULL,
              updated_at TEXT NOT NULL,
              PRIMARY KEY (collection, id)
            );
            CREATE INDEX IF NOT EXISTS idx_app_records_collection ON app_records(collection);
            CREATE TABLE IF NOT EXISTS app_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL);
          `);
          const now = new Date().toISOString();
          const request = {
            id:"req-invoice-fixture",requestCode:"MH3D-INVOICE-TEST",status:"queued",name:"Invoice Test Customer",
            email:"invoice-test@example.test",phone:"",projectType:"other",modelStatus:"ready",fulfillmentMethod:"pickup",
            assemblyPreference:"unsure",quantity:1,dimensions:"",materialPreference:"pla",colorPreference:"",budget:"",
            neededBy:"",neededBySubmitted:"",referenceUrl:"",description:"Final invoice workflow validation.",imageUrl:"",
            attachments:[],internalNote:"",createdAt:now,updatedAt:now,queuedAt:now,queueJobId:"job-invoice-fixture",
            customerAccountId:"",riskLevel:"none",riskFlags:[],source:"customer",emailNotifications:false
          };
          const quote = {
            id:"quote-invoice-fixture",requestId:request.id,requestCode:request.requestCode,customerAccountId:"",
            status:"deposit-paid",revision:1,basePriceCents:10000,assemblyMode:"not-required",assemblyFeeCents:0,rushFeeCents:0,
            fulfillmentMode:"pickup",localDeliveryFeeCents:0,packageWeightOz:0,packageLengthIn:0,packageWidthIn:0,packageHeightIn:0,
            shippingSelection:null,totalCents:10000,depositCents:5000,balanceCents:5000,currency:"usd",material:"PLA",
            dimensions:"Test fixture",estimatedReadyDate:"",notes:"",terms:"Validation fixture terms long enough for the quote model.",
            createdAt:now,updatedAt:now,sentAt:now,approvedAt:now,approvedByCustomerId:"",approvalSnapshot:null,
            stripeCheckoutSessionId:"cs_test_fixture",stripeCheckoutAmountCents:0,depositPaidAt:now,paymentProvider:"stripe",
            payments:[{id:"pay-fixture",revision:1,amountCents:5000,checkoutSessionId:"cs_test_fixture",paymentIntentId:"pi_test_fixture",paidAt:now}],
            refunds:[],history:[]
          };
          const job = {
            id:"job-invoice-fixture",sourceRequestId:request.id,publicCode:"3D-INVTEST",publicTitle:"Invoice workflow test",
            customerName:request.name,customerEmail:request.email,fulfillmentMethod:"pickup",quantity:1,status:"finishing",
            estimatedReadyDate:"",imageUrl:"",publicNote:"",privateNote:"",sortOrder:0,createdAt:now,updatedAt:now,
            completedAt:"",completionEmailSentAt:""
          };
          const insert=db.prepare("INSERT INTO app_records(collection,id,json,updated_at) VALUES (?,?,?,?)");
          insert.run("requests",request.id,JSON.stringify(request),now);
          insert.run("quotes",quote.id,JSON.stringify(quote),now);
          insert.run("queue",job.id,JSON.stringify(job),now);
          db.close();
          NODE

          DATABASE_PATH=/tmp/meshharbor-v086-invoice.sqlite           PRIVATE_STORAGE_DIR=/tmp/meshharbor-v086-invoice-private           CUSTOMER_SESSION_SECRET=ci-invoice-customer-session-secret-1234567890           OWNER_SESSION_SECRET=ci-invoice-owner-session-secret-1234567890123           OWNER_PASSWORD=ci-owner-password-12345           NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3001           npm run dev -- -p 3001 > /tmp/meshharbor-invoice-server.log 2>&1 &
          echo $! > /tmp/meshharbor-invoice-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health >/dev/null || { cat /tmp/meshharbor-invoice-server.log; exit 1; }

          curl -fsS -c /tmp/invoice-owner.cookies             -H "Origin: http://127.0.0.1:3001" -H "Content-Type: application/json"             --data '{"password":"ci-owner-password-12345"}'             http://127.0.0.1:3001/api/owner/login >/tmp/invoice-login.json

          READY_CODE=$(curl -sS -b /tmp/invoice-owner.cookies -o /tmp/invoice-ready.json -w "%{http_code}"             -X PATCH -H "Origin: http://127.0.0.1:3001" -H "Content-Type: application/json"             --data '{"status":"ready"}'             http://127.0.0.1:3001/api/owner/queue/job-invoice-fixture)
          test "$READY_CODE" = "200" || { cat /tmp/invoice-ready.json; cat /tmp/meshharbor-invoice-server.log; exit 1; }

          curl -fsS -b /tmp/invoice-owner.cookies http://127.0.0.1:3001/api/owner/requests >/tmp/invoice-owner-data.json
          node <<'NODE'
          const fs=require("node:fs");
          const data=JSON.parse(fs.readFileSync("/tmp/invoice-owner-data.json","utf8"));
          const invoice=(data.finalInvoices||[]).find(x=>x.requestId==="req-invoice-fixture");
          if(!invoice) throw new Error("Ready transition did not create final invoice");
          if(invoice.status!=="open") throw new Error("Expected open development invoice, got "+invoice.status);
          if(invoice.amountDueCents!==5000 || invoice.amountRemainingCents!==5000) throw new Error("Final invoice amount was not the exact remaining $50.00 balance");
          console.log("Development final invoice created:", invoice);
          NODE

          COMPLETE_CODE=$(curl -sS -b /tmp/invoice-owner.cookies -o /tmp/invoice-complete-blocked.json -w "%{http_code}"             -X PATCH -H "Origin: http://127.0.0.1:3001" -H "Content-Type: application/json"             --data '{"status":"completed"}'             http://127.0.0.1:3001/api/owner/queue/job-invoice-fixture)
          test "$COMPLETE_CODE" = "409" || { cat /tmp/invoice-complete-blocked.json; exit 1; }
          grep -q "final balance invoice must be paid" /tmp/invoice-complete-blocked.json

          node <<'NODE'
          const { DatabaseSync } = require("node:sqlite");
          const db=new DatabaseSync("/tmp/meshharbor-v086-invoice.sqlite");
          const row=db.prepare("SELECT id,json FROM app_records WHERE collection='final-invoices' LIMIT 1").get();
          const invoice=JSON.parse(row.json);
          invoice.status="paid"; invoice.amountPaidCents=invoice.amountDueCents; invoice.amountRemainingCents=0;
          invoice.paidAt=new Date().toISOString(); invoice.updatedAt=invoice.paidAt;
          db.prepare("UPDATE app_records SET json=?,updated_at=? WHERE collection='final-invoices' AND id=?").run(JSON.stringify(invoice),invoice.updatedAt,row.id);
          db.close();
          NODE

          COMPLETE_CODE=$(curl -sS -b /tmp/invoice-owner.cookies -o /tmp/invoice-complete-paid.json -w "%{http_code}"             -X PATCH -H "Origin: http://127.0.0.1:3001" -H "Content-Type: application/json"             --data '{"status":"completed"}'             http://127.0.0.1:3001/api/owner/queue/job-invoice-fixture)
          test "$COMPLETE_CODE" = "200" || { cat /tmp/invoice-complete-paid.json; exit 1; }

      - name: Capture final invoice owner UI
        run: |
          mkdir -p visual-smoke
          node <<'NODE'
          const fs=require("node:fs");
          const { DatabaseSync }=require("node:sqlite");
          const db=new DatabaseSync("/tmp/meshharbor-v086-invoice.sqlite");
          const jobRow=db.prepare("SELECT id,json FROM app_records WHERE collection='queue' AND id='job-invoice-fixture'").get();
          const job=JSON.parse(jobRow.json); job.status="ready"; job.completedAt=""; job.updatedAt=new Date().toISOString();
          db.prepare("UPDATE app_records SET json=?,updated_at=? WHERE collection='queue' AND id=?").run(JSON.stringify(job),job.updatedAt,jobRow.id);
          const reqRow=db.prepare("SELECT id,json FROM app_records WHERE collection='requests' AND id='req-invoice-fixture'").get();
          const req=JSON.parse(reqRow.json); req.status="queued"; req.updatedAt=job.updatedAt;
          db.prepare("UPDATE app_records SET json=?,updated_at=? WHERE collection='requests' AND id=?").run(JSON.stringify(req),req.updatedAt,reqRow.id);
          const invRow=db.prepare("SELECT id,json FROM app_records WHERE collection='final-invoices' LIMIT 1").get();
          const inv=JSON.parse(invRow.json); inv.status="open"; inv.amountPaidCents=0; inv.amountRemainingCents=inv.amountDueCents; inv.paidAt=""; inv.updatedAt=job.updatedAt;
          db.prepare("UPDATE app_records SET json=?,updated_at=? WHERE collection='final-invoices' AND id=?").run(JSON.stringify(inv),inv.updatedAt,invRow.id);
          db.close();
          NODE

          rm -rf /tmp/meshharbor-invoice-chrome
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --remote-debugging-port=9224 --user-data-dir=/tmp/meshharbor-invoice-chrome about:blank >/tmp/invoice-chrome.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9224/json/version >/dev/null && break
            sleep 0.5
          done
          node <<'NODE'
          const fs=require("node:fs");
          const pages=await (await fetch("http://127.0.0.1:9224/json/list")).json();
          const page=pages.find(p=>p.type==="page");
          if(!page) throw new Error("No Chrome page target");
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});
          let id=0;const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);}};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          await send("Page.enable"); await send("Runtime.enable");
          await send("Emulation.setDeviceMetricsOverride",{width:1440,height:1200,deviceScaleFactor:1,mobile:false});
          await send("Page.navigate",{url:"http://127.0.0.1:3001/owner"}); await wait(1000);
          await send("Runtime.evaluate",{expression:`fetch("/api/owner/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:"ci-owner-password-12345"})})`,awaitPromise:true});
          await send("Page.navigate",{url:"http://127.0.0.1:3001/owner"}); await wait(1600);
          await send("Runtime.evaluate",{expression:`document.querySelector(".production-request-header")?.click()`}); await wait(500);
          const body=await send("Runtime.evaluate",{expression:`document.body.innerText.includes("FINAL BALANCE") && document.body.innerText.includes("$50.00")`,returnByValue:true});
          if(!body.result.value) throw new Error("Final balance panel was not visible in owner UI");
          const shot=await send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,fromSurface:true});
          fs.writeFileSync("visual-smoke/owner-final-invoice-v086.png",Buffer.from(shot.data,"base64"));
          ws.close();
          NODE

      - name: Verify responsive pages do not overflow horizontally
        run: |
          rm -rf /tmp/meshharbor-chrome-profile
          google-chrome --headless=new --no-sandbox --disable-gpu             --remote-debugging-port=9222 --user-data-dir=/tmp/meshharbor-chrome-profile about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 0.5
          done
          node <<'NODE'
          const widths = [320,390,430,650,720,721,1024,1440,1920,2560,3440];
          const paths = ["/", "/gallery", "/custom-request", "/queue", "/login", "/login?admin=1", "/privacy"];
          const pages = await (await fetch("http://127.0.0.1:9222/json/list")).json();
          if (!pages.length) throw new Error("Chrome debugging page was not available.");
          const ws = new WebSocket(pages[0].webSocketDebuggerUrl);
          await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });
          let id = 0;
          const pending = new Map();
          ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (!message.id || !pending.has(message.id)) return;
            const {resolve, reject} = pending.get(message.id);
            pending.delete(message.id);
            message.error ? reject(new Error(message.error.message)) : resolve(message.result);
          };
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const callId = ++id;
            pending.set(callId, {resolve, reject});
            ws.send(JSON.stringify({id: callId, method, params}));
          });
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          await send("Page.enable");
          await send("Runtime.enable");
          const failures = [];
          for (const pagePath of paths) {
            for (const width of widths) {
              await send("Emulation.setDeviceMetricsOverride", {width, height:1200, deviceScaleFactor:1, mobile:width<=720});
              await send("Page.navigate", {url:"http://127.0.0.1:3000" + pagePath});
              await wait(700);
              const evaluated = await send("Runtime.evaluate", {
                expression:`(() => ({scrollWidth:document.documentElement.scrollWidth, clientWidth:document.documentElement.clientWidth, bodyWidth:document.body.scrollWidth}))()`,
                returnByValue:true,
              });
              const value = evaluated.result.value;
              if (value.scrollWidth > value.clientWidth + 1 || value.bodyWidth > value.clientWidth + 1) {
                failures.push({pagePath, width, ...value});
              }
            }
          }
          ws.close();
          if (failures.length) {
            console.error("Horizontal overflow detected:", JSON.stringify(failures, null, 2));
            process.exit(1);
          }
          console.log("Responsive overflow matrix passed:", widths.join(", "));
          NODE
      - name: Capture responsive visual matrix
        run: |
          mkdir -p visual-smoke
          for W in 320 390 430 650 720 721 1024 1440 1920 2560 3440; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1               --window-size=$W,1200 --screenshot=visual-smoke/home-$W.png http://127.0.0.1:3000/
          done
          for W in 320 390 720 721 1440 1920 3440; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1               --window-size=$W,3000 --screenshot=visual-smoke/custom-request-$W.png http://127.0.0.1:3000/custom-request
          done
          for W in 390 720 721 1440 1920 3440; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1               --window-size=$W,1300 --screenshot=visual-smoke/owner-login-$W.png 'http://127.0.0.1:3000/login?admin=1'
          done
      - name: Upload responsive visual matrix
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-matrix-v086
          path: visual-smoke/*.png
          retention-days: 7

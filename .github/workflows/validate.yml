          if(data.verification?.healthy!==true) throw new Error("Generated backup did not verify healthy");
          if(data.verification?.quickCheck!=="ok") throw new Error("SQLite quick_check did not report ok");
          if(!Array.isArray(data.verification?.requiredTables)||!data.verification.requiredTables.includes("app_records")) throw new Error("Backup verification did not confirm required tables");
          NODE
          BAD_BACKUP_STATUS=$(curl -sS -b /tmp/v088-after-disable.cookies -o /tmp/v088-backup-bad.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data '{"name":"../escape"}'             http://127.0.0.1:3000/api/owner/backups/verify)

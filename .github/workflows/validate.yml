                if(tabCheck.result.value.count!==4||tabCheck.result.value.clipped.length){
                  failures.push({width,type:"owner-tabs-clipped",tabs:tabCheck.result.value});
                }
              }
              const shot=await send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,fromSurface:true});
              fs.writeFileSync(`visual-smoke/owner-operations-${width}.png`,Buffer.from(shot.data,"base64"));
            }
            ws.close();
            if(failures.length)throw new Error("Owner Operations Center horizontal overflow: "+JSON.stringify(failures));
          })().catch(error=>{console.error(error);process.exit(1);});

      - name: Verify owner security management UI
        run: |
          setsid env \
          NEXT_PUBLIC_SITE_URL=http://localhost:3002 \
          DATABASE_PATH=/tmp/meshharbor-v086.sqlite \
          PRIVATE_STORAGE_DIR=/tmp/meshharbor-private \
          CUSTOMER_SESSION_SECRET=ci-customer-session-secret-12345678901234567890 \
          OWNER_SESSION_SECRET=ci-owner-session-secret-12345678901234567890123 \
          OWNER_PASSWORD=ci-owner-password-12345 \
          npm run dev -- -p 3002 > /tmp/v088-security-server.log 2>&1 &
          echo $! > /tmp/v088-security-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3002/api/health >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3002/api/health >/dev/null || { cat /tmp/v088-security-server.log; exit 1; }

          rm -rf /tmp/meshharbor-v088-security-chrome
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9224 --user-data-dir=/tmp/meshharbor-v088-security-chrome about:blank >/tmp/v088-security-chrome.log 2>&1 &
          echo $! > /tmp/v088-security-chrome.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:9224/json/version >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:9224/json/version >/dev/null || { cat /tmp/v088-security-chrome.log; ps -ef | grep -E 'chrome|chromium' | grep -v grep || true; exit 1; }
          mkdir -p visual-smoke
          node <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto");
          (async()=>{
            const pages=await (await fetch("http://127.0.0.1:9224/json/list")).json();
            const page=pages.find(p=>p.type==="page"); if(!page)throw new Error("No Chrome page target");
            const ws=new WebSocket(page.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});
            let id=0;const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);}};
            const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            await send("Page.enable"); await send("Runtime.enable");
            await send("Emulation.setDeviceMetricsOverride",{width:1440,height:1400,deviceScaleFactor:1,mobile:false});
            await send("Page.navigate",{url:"http://localhost:3002/login?admin=1"}); await wait(700);
            const login=await send("Runtime.evaluate",{expression:`(async()=>{const r=await fetch("/api/owner/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:"ci-owner-password-12345"})});return {status:r.status,text:await r.text(),origin:location.origin};})()`,awaitPromise:true,returnByValue:true});
            if(login.result.value?.status!==200){
              let serverLog="";try{serverLog=fs.readFileSync("/tmp/v088-security-server.log","utf8").slice(-12000);}catch{}
              throw new Error("Owner security UI browser login failed: "+JSON.stringify(login.result.value)+" Server log: "+serverLog);
            }
            await send("Page.navigate",{url:"http://localhost:3002/owner"}); await wait(1000);
            const clicked=await send("Runtime.evaluate",{expression:`(()=>{const b=[...document.querySelectorAll(".owner-tabs button")].find(x=>x.textContent?.includes("Security & Backups"));b?.click();return Boolean(b);})()`,returnByValue:true});
            if(!clicked.result.value)throw new Error("Security & Backups tab missing");
            await wait(700);
            const body=await send("Runtime.evaluate",{expression:`document.body.innerText`,returnByValue:true});
            const text=body.result.value||"";
            for(const required of ["Two-factor authentication","Sign out other owner sessions","Verify backup"]){
              if(!text.includes(required))throw new Error("Owner security UI missing: "+required);
            }
            const securityWidths=[320,390,720,721,1440,3440];
            const securityOverflow=[];
            for(const width of securityWidths){
              await send("Emulation.setDeviceMetricsOverride",{width,height:1400,deviceScaleFactor:1,mobile:width<=720});
              await wait(200);
              const metrics=await send("Runtime.evaluate",{expression:`(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyWidth:document.body.scrollWidth}))()`,returnByValue:true});
              const value=metrics.result.value;
              if(value.scrollWidth>value.clientWidth+1||value.bodyWidth>value.clientWidth+1)securityOverflow.push({width,...value});
              const shot=await send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,fromSurface:true});
              fs.writeFileSync(`visual-smoke/owner-security-v088-${width}.png`,Buffer.from(shot.data,"base64"));
            }
            if(securityOverflow.length)throw new Error("Owner security panel horizontal overflow: "+JSON.stringify(securityOverflow));
            await send("Emulation.setDeviceMetricsOverride",{width:1440,height:1400,deviceScaleFactor:1,mobile:false});
            await wait(200);

            const setup=await send("Runtime.evaluate",{expression:`(async()=>{const r=await fetch("/api/owner/security/2fa/setup",{method:"POST"});return {status:r.status,body:await r.json()};})()`,awaitPromise:true,returnByValue:true});
            if(setup.result.value?.status!==200)throw new Error("Browser 2FA setup failed: "+JSON.stringify(setup.result.value));
            const secret=setup.result.value.body.manualSecret;
            const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";let bits=0,buffer=0;const bytes=[];
            for(const char of secret){buffer=(buffer<<5)|alphabet.indexOf(char);bits+=5;if(bits>=8){bytes.push((buffer>>>(bits-8))&255);bits-=8;}}
            const counter=Math.floor(Date.now()/1000/30);const msg=Buffer.alloc(8);msg.writeBigUInt64BE(BigInt(counter));
            const digest=crypto.createHmac("sha1",Buffer.from(bytes)).update(msg).digest();const offset=digest[digest.length-1]&15;
            const code=String(((((digest[offset]&127)<<24)|((digest[offset+1]&255)<<16)|((digest[offset+2]&255)<<8)|(digest[offset+3]&255))>>>0)%1000000).padStart(6,"0");
            const enabled=await send("Runtime.evaluate",{expression:`(async()=>{const r=await fetch("/api/owner/security/2fa/enable",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:"${code}"})});return {status:r.status,text:await r.text()};})()`,awaitPromise:true,returnByValue:true});
            if(enabled.result.value?.status!==200)throw new Error("Browser 2FA enable failed: "+JSON.stringify(enabled.result.value));
            await send("Runtime.evaluate",{expression:`fetch("/api/owner/logout",{method:"POST"})`,awaitPromise:true});
            await send("Page.navigate",{url:"http://localhost:3002/login?admin=1"}); await wait(700);
            const submitted=await send("Runtime.evaluate",{expression:`(()=>{const input=document.querySelector('input[name="password"]');const form=input?.closest("form");if(!input||!form)return false;const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value")?.set;setter?.call(input,"ci-owner-password-12345");input.dispatchEvent(new Event("input",{bubbles:true}));form.requestSubmit();return true;})()`,returnByValue:true});
            if(!submitted.result.value)throw new Error("Owner password form could not be submitted");
            let secondFactor=false;
            for(let i=0;i<30;i++){
              const state=await send("Runtime.evaluate",{expression:`document.body.innerText.includes("Authenticator code") && document.body.innerText.includes("Use a recovery code")`,returnByValue:true});
              if(state.result.value){secondFactor=true;break;}
              await wait(200);
            }
            if(!secondFactor)throw new Error("Owner login did not transition to the second-factor UI");
            const secondFactorValue=await send("Runtime.evaluate",{expression:`document.querySelector('input[name="code"]')?.value || ""`,returnByValue:true});
            if(secondFactorValue.result.value)throw new Error("Second-factor input retained a previous credential value.");
            const loginShot=await send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,fromSurface:true});
            fs.writeFileSync("visual-smoke/owner-login-second-factor-v088.png",Buffer.from(loginShot.data,"base64"));
            ws.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          if [ -f /tmp/v088-security-server.pid ]; then kill -- "-$(cat /tmp/v088-security-server.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/v088-security-chrome.pid ]; then kill "$(cat /tmp/v088-security-chrome.pid)" 2>/dev/null || true; fi
          for i in {1..20}; do
            if ! curl -fsS http://127.0.0.1:3002/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done


name: Validate Website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start production app
        env:
          NEXT_PUBLIC_SITE_URL: https://meshharbor3d.com
          DATABASE_PATH: /tmp/meshharbor-v086.sqlite
          PRIVATE_STORAGE_DIR: /tmp/meshharbor-private
          CUSTOMER_SESSION_SECRET: ci-customer-session-secret-12345678901234567890
          OWNER_SESSION_SECRET: ci-owner-session-secret-12345678901234567890123
          OWNER_PASSWORD: ci-owner-password-12345
        run: |
          npm start > /tmp/meshharbor-server.log 2>&1 &
          echo $! > /tmp/meshharbor-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/meshharbor-server.log
          exit 1
      - name: Verify proxied origin validation
        run: |
          REG_CODE=$(curl -sS -o /tmp/register.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https" -H "Content-Type: application/json"             --data '{"displayName":"","email":"bad","password":"short"}'             http://127.0.0.1:3000/api/account/register)
          test "$REG_CODE" = "400" || { cat /tmp/register.json; exit 1; }

          EVIL_CODE=$(curl -sS -o /tmp/evil.json -w "%{http_code}"             -H "Origin: https://example.invalid" -H "Content-Type: application/json"             --data '{"displayName":"","email":"bad","password":"short"}'             http://127.0.0.1:3000/api/account/register)
          test "$EVIL_CODE" = "403" || { cat /tmp/evil.json; exit 1; }

          UPLOAD_CODE=$(curl -sS -o /tmp/upload.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https" -F "note=test"             http://127.0.0.1:3000/api/custom-request/upload)
          test "$UPLOAD_CODE" = "400" || { cat /tmp/upload.json; exit 1; }

          OWNER_CODE=$(curl -sS -o /tmp/owner-login.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data '{"password":"definitely-not-the-owner-password"}'             http://127.0.0.1:3000/api/owner/login)
          test "$OWNER_CODE" = "401" || { cat /tmp/owner-login.json; exit 1; }
          grep -q "Incorrect password" /tmp/owner-login.json
      - name: Verify 3MF reaches malware scanning
        run: |
          mkdir -p /tmp/three-mf/3D
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>' > /tmp/three-mf/'[Content_Types].xml'
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><resources/><build/></model>' > /tmp/three-mf/3D/3dmodel.model
          (cd /tmp/three-mf && zip -qr /tmp/meshharbor-test.3mf .)
          CODE=$(curl -sS -o /tmp/3mf.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https" -F "file=@/tmp/meshharbor-test.3mf;type=model/3mf"             http://127.0.0.1:3000/api/custom-request/upload)
          test "$CODE" = "503" || { cat /tmp/3mf.json; exit 1; }
          grep -q "File scanning is temporarily unavailable" /tmp/3mf.json
      - name: Verify owner security status endpoint
        run: |
          curl -fsS -c /tmp/v088-owner.cookies             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data '{"password":"ci-owner-password-12345"}'             http://127.0.0.1:3000/api/owner/login >/tmp/v088-owner-login.json
          SECURITY_CODE=$(curl -sS -b /tmp/v088-owner.cookies -o /tmp/v088-security.json -w "%{http_code}"             http://127.0.0.1:3000/api/owner/security)
          test "$SECURITY_CODE" = "200" || {
            echo "Expected owner security status endpoint to return 200, got $SECURITY_CODE"
            cat /tmp/v088-security.json
            exit 1
          }
          node <<'NODE'
          const fs=require("node:fs");
          const data=JSON.parse(fs.readFileSync("/tmp/v088-security.json","utf8"));
          if(typeof data.security?.twoFactorEnabled!=="boolean") throw new Error("twoFactorEnabled status missing");
          if(typeof data.security?.recoveryCodesRemaining!=="number") throw new Error("recoveryCodesRemaining status missing");
          NODE

          SETUP_CODE=$(curl -sS -b /tmp/v088-owner.cookies -o /tmp/v088-2fa-setup.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             http://127.0.0.1:3000/api/owner/security/2fa/setup)
          test "$SETUP_CODE" = "200" || {
            echo "Expected 2FA setup endpoint to return 200, got $SETUP_CODE"
            cat /tmp/v088-2fa-setup.json
            exit 1
          }
          node <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          const data=JSON.parse(fs.readFileSync("/tmp/v088-2fa-setup.json","utf8"));
          if(!/^[A-Z2-7]{32}$/.test(data.manualSecret||"")) throw new Error("Manual TOTP secret missing or invalid");
          if(!(data.otpauthUri||"").startsWith("otpauth://totp/")) throw new Error("otpauth URI missing");
          if(!(data.qrDataUrl||"").startsWith("data:image/")) throw new Error("QR data URL missing");
          const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
          const normalized=data.manualSecret.toUpperCase().replace(/[^A-Z2-7]/g,"");
          let bits=0,buffer=0;const bytes=[];
          for(const char of normalized){buffer=(buffer<<5)|alphabet.indexOf(char);bits+=5;if(bits>=8){bytes.push((buffer>>>(bits-8))&255);bits-=8;}}
          const counter=Math.floor(Date.now()/1000/30);
          const msg=Buffer.alloc(8);msg.writeBigUInt64BE(BigInt(counter));
          const digest=crypto.createHmac("sha1",Buffer.from(bytes)).update(msg).digest();
          const offset=digest[digest.length-1]&15;
          const value=((((digest[offset]&127)<<24)|((digest[offset+1]&255)<<16)|((digest[offset+2]&255)<<8)|(digest[offset+3]&255))>>>0)%1000000;
          fs.writeFileSync("/tmp/v088-totp.txt",String(value).padStart(6,"0"));
          fs.writeFileSync("/tmp/v088-secret.txt",data.manualSecret);
          NODE
          cp /tmp/v088-totp.txt /tmp/v088-totp-node.txt
          python3 <<'PY'
          import base64, hashlib, hmac, json, struct, time
          with open("/tmp/v088-2fa-setup.json", "r", encoding="utf-8") as handle:
              secret=json.load(handle)["manualSecret"]
          key=base64.b32decode(secret)
          counter=int(time.time())//30
          digest=hmac.new(key, struct.pack(">Q", counter), hashlib.sha1).digest()
          offset=digest[-1] & 0x0F
          value=(struct.unpack(">I", digest[offset:offset+4])[0] & 0x7FFFFFFF) % 1000000
          with open("/tmp/v088-totp-python.txt", "w", encoding="utf-8") as handle:
              handle.write(f"{value:06d}")
          PY
          cmp /tmp/v088-totp-node.txt /tmp/v088-totp-python.txt || {
            echo "TOTP implementation does not match the Python standard-library oracle."
            echo "Node: $(cat /tmp/v088-totp-node.txt)"
            echo "Python: $(cat /tmp/v088-totp-python.txt)"
            exit 1
          }
          cp /tmp/v088-totp-python.txt /tmp/v088-totp.txt

          ENABLE_CODE=$(curl -sS -b /tmp/v088-owner.cookies -c /tmp/v088-enabled-owner.cookies -o /tmp/v088-2fa-enable.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data "$(node -e 'process.stdout.write(JSON.stringify({code:require("fs").readFileSync("/tmp/v088-totp.txt","utf8")}))')"             http://127.0.0.1:3000/api/owner/security/2fa/enable)
          test "$ENABLE_CODE" = "200" || {
            echo "Expected 2FA enable endpoint to return 200, got $ENABLE_CODE"
            cat /tmp/v088-2fa-enable.json
            exit 1
          }
          node <<'NODE'
          const fs=require("node:fs");
          const {DatabaseSync}=require("node:sqlite");
          const data=JSON.parse(fs.readFileSync("/tmp/v088-2fa-enable.json","utf8"));
          if(data.security?.twoFactorEnabled!==true) throw new Error("2FA was not enabled");
          if(!Array.isArray(data.recoveryCodes)||data.recoveryCodes.length!==10) throw new Error("Expected 10 recovery codes");
          if(!data.recoveryCodes.every(code=>/^MH3D-[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$/.test(code))) throw new Error("Recovery code format invalid");
          fs.writeFileSync("/tmp/v088-recovery.txt",data.recoveryCodes[0]);
          fs.writeFileSync("/tmp/v088-recovery-old2.txt",data.recoveryCodes[1]);
          const secret=fs.readFileSync("/tmp/v088-secret.txt","utf8");
          const db=new DatabaseSync("/tmp/meshharbor-v086.sqlite");
          const row=db.prepare("SELECT json FROM app_records WHERE collection='owner-security' AND id='singleton'").get();
          db.close();
          if(!row?.json) throw new Error("Owner security record missing");
          if(row.json.includes(secret)) throw new Error("Raw TOTP secret was stored in SQLite");
          const stored=JSON.parse(row.json);
          if(!stored.totpSecretCiphertext||stored.totpSecretCiphertext===secret) throw new Error("Encrypted TOTP secret missing");
          if((stored.recoveryCodeHashes||[]).some(value=>data.recoveryCodes.includes(value))) throw new Error("Recovery codes were stored in plaintext");
          NODE

          PRE_ENABLE_SESSION_STATUS=$(curl -sS -b /tmp/v088-owner.cookies -o /tmp/v088-pre-enable-session.json -w "%{http_code}" http://127.0.0.1:3000/api/owner/security)
          test "$PRE_ENABLE_SESSION_STATUS" = "401" || { echo "Enabling 2FA did not revoke the pre-2FA owner session"; cat /tmp/v088-pre-enable-session.json; exit 1; }
          ENABLED_SESSION_STATUS=$(curl -sS -b /tmp/v088-enabled-owner.cookies -o /tmp/v088-enabled-session.json -w "%{http_code}" http://127.0.0.1:3000/api/owner/security)
          test "$ENABLED_SESSION_STATUS" = "200" || { echo "Current owner session was not refreshed after enabling 2FA"; cat /tmp/v088-enabled-session.json; exit 1; }

          rm -f /tmp/v088-challenge.cookies /tmp/v088-2fa-password.headers
          LOGIN_2FA_CODE=$(curl -sS -D /tmp/v088-2fa-password.headers -c /tmp/v088-challenge.cookies -o /tmp/v088-2fa-password.json -w "%{http_code}"             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data '{"password":"ci-owner-password-12345"}'             http://127.0.0.1:3000/api/owner/login)
          test "$LOGIN_2FA_CODE" = "200" || { cat /tmp/v088-2fa-password.json; exit 1; }
          node <<'NODE'
          const fs=require("node:fs");
          const body=JSON.parse(fs.readFileSync("/tmp/v088-2fa-password.json","utf8"));
          if(body.requiresSecondFactor!==true) throw new Error("Password login did not require the configured second factor");
          const cookies=fs.readFileSync("/tmp/v088-challenge.cookies","utf8");
          if(!cookies.includes("lc3d_owner_challenge")) throw new Error("Second-factor challenge cookie missing");
          if(/\tlc3d_owner\t/.test(cookies)) throw new Error("Full owner session was issued before second-factor verification");
          NODE
          CHALLENGE_ACCESS=$(curl -sS -b /tmp/v088-challenge.cookies -o /tmp/v088-challenge-access.json -w "%{http_code}"             http://127.0.0.1:3000/api/owner/security)
          test "$CHALLENGE_ACCESS" = "401" || { echo "Challenge cookie unexpectedly authorized owner access"; cat /tmp/v088-challenge-access.json; exit 1; }

          WRONG_2FA=$(curl -sS -b /tmp/v088-challenge.cookies -c /tmp/v088-challenge.cookies -o /tmp/v088-wrong-2fa.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data '{"code":"000000"}'             http://127.0.0.1:3000/api/owner/login/verify)
          test "$WRONG_2FA" = "401" || { echo "Expected incorrect second factor to return 401, got $WRONG_2FA"; cat /tmp/v088-wrong-2fa.json; exit 1; }

          node <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto");
          const secret=fs.readFileSync("/tmp/v088-secret.txt","utf8").trim();
          const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";let bits=0,buffer=0;const bytes=[];
          for(const char of secret){buffer=(buffer<<5)|alphabet.indexOf(char);bits+=5;if(bits>=8){bytes.push((buffer>>>(bits-8))&255);bits-=8;}}
          const counter=Math.floor(Date.now()/1000/30);const msg=Buffer.alloc(8);msg.writeBigUInt64BE(BigInt(counter));
          const digest=crypto.createHmac("sha1",Buffer.from(bytes)).update(msg).digest();const offset=digest[digest.length-1]&15;
          const value=((((digest[offset]&127)<<24)|((digest[offset+1]&255)<<16)|((digest[offset+2]&255)<<8)|(digest[offset+3]&255))>>>0)%1000000;
          fs.writeFileSync("/tmp/v088-current-totp.txt",String(value).padStart(6,"0"));
          NODE
          VALID_2FA=$(curl -sS -b /tmp/v088-challenge.cookies -c /tmp/v088-full-owner.cookies -o /tmp/v088-valid-2fa.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data "$(node -e 'process.stdout.write(JSON.stringify({code:require("fs").readFileSync("/tmp/v088-current-totp.txt","utf8")}))')"             http://127.0.0.1:3000/api/owner/login/verify)
          test "$VALID_2FA" = "200" || { echo "Valid authenticator code failed"; cat /tmp/v088-valid-2fa.json; exit 1; }
          FULL_ACCESS=$(curl -sS -b /tmp/v088-full-owner.cookies -o /tmp/v088-full-access.json -w "%{http_code}" http://127.0.0.1:3000/api/owner/security)
          test "$FULL_ACCESS" = "200" || { echo "Verified second factor did not create an owner session"; cat /tmp/v088-full-access.json; exit 1; }

          curl -fsS -c /tmp/v088-recovery-challenge.cookies             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data '{"password":"ci-owner-password-12345"}'             http://127.0.0.1:3000/api/owner/login >/tmp/v088-recovery-login.json
          RECOVERY_CODE=$(cat /tmp/v088-recovery.txt)
          RECOVERY_STATUS=$(curl -sS -b /tmp/v088-recovery-challenge.cookies -c /tmp/v088-recovery-owner.cookies -o /tmp/v088-recovery-use.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data "$(node -e 'process.stdout.write(JSON.stringify({code:process.argv[1]}))' "$RECOVERY_CODE")"             http://127.0.0.1:3000/api/owner/login/verify)
          test "$RECOVERY_STATUS" = "200" || { echo "Recovery code did not authorize"; cat /tmp/v088-recovery-use.json; exit 1; }

          curl -fsS -c /tmp/v088-replay-challenge.cookies             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data '{"password":"ci-owner-password-12345"}'             http://127.0.0.1:3000/api/owner/login >/tmp/v088-replay-login.json
          REPLAY_STATUS=$(curl -sS -b /tmp/v088-replay-challenge.cookies -o /tmp/v088-recovery-replay.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data "$(node -e 'process.stdout.write(JSON.stringify({code:process.argv[1]}))' "$RECOVERY_CODE")"             http://127.0.0.1:3000/api/owner/login/verify)
          test "$REPLAY_STATUS" = "401" || { echo "Used recovery code was accepted twice"; cat /tmp/v088-recovery-replay.json; exit 1; }

          cp /tmp/v088-full-owner.cookies /tmp/v088-old-owner.cookies
          REVOKE_STATUS=$(curl -sS -b /tmp/v088-full-owner.cookies -c /tmp/v088-current-owner.cookies -o /tmp/v088-revoke.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             http://127.0.0.1:3000/api/owner/security/sessions/revoke)
          test "$REVOKE_STATUS" = "200" || { echo "Session revoke endpoint failed"; cat /tmp/v088-revoke.json; exit 1; }
          OLD_SESSION_STATUS=$(curl -sS -b /tmp/v088-old-owner.cookies -o /tmp/v088-old-session.json -w "%{http_code}"             http://127.0.0.1:3000/api/owner/security)
          test "$OLD_SESSION_STATUS" = "401" || { echo "Old owner session survived session generation revocation"; cat /tmp/v088-old-session.json; exit 1; }
          CURRENT_SESSION_STATUS=$(curl -sS -b /tmp/v088-current-owner.cookies -o /tmp/v088-current-session.json -w "%{http_code}"             http://127.0.0.1:3000/api/owner/security)
          test "$CURRENT_SESSION_STATUS" = "200" || { echo "Current owner session was not refreshed after revocation"; cat /tmp/v088-current-session.json; exit 1; }

          node <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto");
          const secret=fs.readFileSync("/tmp/v088-secret.txt","utf8").trim();
          const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";let bits=0,buffer=0;const bytes=[];
          for(const char of secret){buffer=(buffer<<5)|alphabet.indexOf(char);bits+=5;if(bits>=8){bytes.push((buffer>>>(bits-8))&255);bits-=8;}}
          const counter=Math.floor(Date.now()/1000/30);const msg=Buffer.alloc(8);msg.writeBigUInt64BE(BigInt(counter));
          const digest=crypto.createHmac("sha1",Buffer.from(bytes)).update(msg).digest();const offset=digest[digest.length-1]&15;
          const value=((((digest[offset]&127)<<24)|((digest[offset+1]&255)<<16)|((digest[offset+2]&255)<<8)|(digest[offset+3]&255))>>>0)%1000000;
          fs.writeFileSync("/tmp/v088-management-totp.txt",String(value).padStart(6,"0"));
          NODE

          REGEN_STATUS=$(curl -sS -b /tmp/v088-current-owner.cookies -o /tmp/v088-recovery-regen.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data "$(node -e 'process.stdout.write(JSON.stringify({code:require("fs").readFileSync("/tmp/v088-management-totp.txt","utf8")}))')"             http://127.0.0.1:3000/api/owner/security/2fa/recovery)
          test "$REGEN_STATUS" = "200" || { echo "Recovery regeneration endpoint failed"; cat /tmp/v088-recovery-regen.json; exit 1; }
          node <<'NODE'
          const fs=require("node:fs");
          const data=JSON.parse(fs.readFileSync("/tmp/v088-recovery-regen.json","utf8"));
          if(!Array.isArray(data.recoveryCodes)||data.recoveryCodes.length!==10) throw new Error("Recovery regeneration did not return 10 new one-time codes");
          fs.writeFileSync("/tmp/v088-recovery-new.txt",data.recoveryCodes[0]);
          NODE

          curl -fsS -c /tmp/v088-oldcode-challenge.cookies             -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data '{"password":"ci-owner-password-12345"}'             http://127.0.0.1:3000/api/owner/login >/tmp/v088-oldcode-login.json
          OLD_RECOVERY=$(cat /tmp/v088-recovery-old2.txt)
          OLD_RECOVERY_STATUS=$(curl -sS -b /tmp/v088-oldcode-challenge.cookies -o /tmp/v088-oldcode-use.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json" --data "$(node -e 'process.stdout.write(JSON.stringify({code:process.argv[1]}))' "$OLD_RECOVERY")"             http://127.0.0.1:3000/api/owner/login/verify)
          test "$OLD_RECOVERY_STATUS" = "401" || { echo "Regenerated recovery codes did not invalidate old codes"; cat /tmp/v088-oldcode-use.json; exit 1; }

          cp /tmp/v088-current-owner.cookies /tmp/v088-before-disable.cookies
          DISABLE_STATUS=$(curl -sS -b /tmp/v088-current-owner.cookies -c /tmp/v088-after-disable.cookies -o /tmp/v088-disable.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             -H "Content-Type: application/json"             --data "$(node -e 'process.stdout.write(JSON.stringify({password:"ci-owner-password-12345",code:require("fs").readFileSync("/tmp/v088-management-totp.txt","utf8")}))')"             http://127.0.0.1:3000/api/owner/security/2fa/disable)
          test "$DISABLE_STATUS" = "200" || { echo "2FA disable endpoint failed"; cat /tmp/v088-disable.json; exit 1; }
          node <<'NODE'
          const fs=require("node:fs");
          const data=JSON.parse(fs.readFileSync("/tmp/v088-disable.json","utf8"));
          if(data.security?.twoFactorEnabled!==false) throw new Error("2FA disable response still reports enabled");
          if(data.security?.recoveryCodesRemaining!==0) throw new Error("Recovery codes were not cleared when 2FA was disabled");
          NODE
          BEFORE_DISABLE_STATUS=$(curl -sS -b /tmp/v088-before-disable.cookies -o /tmp/v088-before-disable-access.json -w "%{http_code}" http://127.0.0.1:3000/api/owner/security)
          test "$BEFORE_DISABLE_STATUS" = "401" || { echo "Pre-disable owner session survived generation change"; cat /tmp/v088-before-disable-access.json; exit 1; }
          AFTER_DISABLE_STATUS=$(curl -sS -b /tmp/v088-after-disable.cookies -o /tmp/v088-after-disable-access.json -w "%{http_code}" http://127.0.0.1:3000/api/owner/security)
          test "$AFTER_DISABLE_STATUS" = "200" || { echo "Current owner was not kept signed in after disabling 2FA"; cat /tmp/v088-after-disable-access.json; exit 1; }

          BACKUP_CREATE_STATUS=$(curl -sS -b /tmp/v088-after-disable.cookies -o /tmp/v088-backup-create.json -w "%{http_code}"             -X POST -H "Origin: https://meshharbor3d.com" -H "X-Forwarded-Host: meshharbor3d.com" -H "X-Forwarded-Proto: https"             http://127.0.0.1:3000/api/owner/backups)

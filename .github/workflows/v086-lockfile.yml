name: Generate v0.86 lockfile

on:
  push:
    branches: [feature/v086-final-balance-invoicing]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v086-final-balance-invoicing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update package lock
        run: |
          if grep -q '"node_modules/stripe"' package-lock.json; then
            echo "Stripe already present in lockfile."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "V0.86 update lockfile for Stripe SDK"
          git push
